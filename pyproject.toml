[project]
name = "resrise-studio"
version = "1.0.0"
description = "Resrise AI Creative Studio - Landing page + Instagram automation suite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "httpx>=0.26.0,<1.0.0",
    "typer>=0.9.0,<1.0.0",
    "rich>=13.7.0,<14.0.0",
    "structlog>=24.1.0,<25.0.0",
    "tenacity>=8.2.0,<9.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0,<1.0.0",
    "black>=24.1.0,<25.0.0",
    "pyright>=1.1.300,<2.0.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pre-commit>=3.6.0,<4.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scripts", "scripts.core", "scripts.agents", "scripts.dashboard", "scripts.cli"]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM103", "E741", "E402"]

[tool.ruff.lint.per-file-ignores]
"scripts/__init__.py" = ["F401"]
"scripts/core/__init__.py" = ["F401"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
pythonPlatform = "Windows"
reportMissingImports = true
reportMissingTypeStubs = true
reportUnknownMemberType = true
reportUnknownParameterType = true
reportUnknownVariableType = true
reportUnusedImport = true
reportUnusedFunction = true
reportUnusedVariable = true
exclude = [
    "**/__pycache__**",
    "**/.venv**",
    "**/.pytest_cache**",
    "**/.mypy_cache**",
    "**/.ruff_cache**",
    "**/dist**",
    "**/build**",
    "**/node_modules**",
]
stubPath = "stubs"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --cov=scripts.affiliate_mappings --cov=scripts.core --cov=scripts.ig_replier --cov=scripts.ig_network_engager --cov-report=term-missing"

[tool.coverage.run]
source = ["scripts"]
omit = [
    "**/tests/**",
    "**/__pycache__/**",
    "**/.venv/**",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
]